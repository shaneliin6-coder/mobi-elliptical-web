<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0d1117">
<title>莫比椭圆机控制台</title>
<style>
  :root { --bg:#0d1117; --card:#161b22; --fg:#e6edf3; --dim:#8b949e; --acc:#2ea043; --warn:#d29922; --bad:#f85149; --line:#30363d; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,"PingFang SC","Helvetica Neue",sans-serif; padding:10px 12px 24px; }
  h1 { font-size:17px; margin:6px 0 2px; }
  .sub { color:var(--dim); font-size:12px; margin-bottom:10px; }
  .btn { display:block; width:100%; padding:15px; font-size:17px; font-weight:600; border:none; border-radius:12px; background:var(--acc); color:#fff; margin:8px 0; }
  .btn:disabled { background:#2d333b; color:var(--dim); }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin:10px 0; }
  .cell { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:10px 12px; }
  .cell .k { font-size:11px; color:var(--dim); }
  .cell .v { font-size:24px; font-weight:700; font-variant-numeric:tabular-nums; margin-top:2px; }
  .cell .u { font-size:11px; color:var(--dim); font-weight:400; }
  #st-proto .v { color:var(--acc); font-size:15px; }
  #st-src .v { color:var(--warn); font-size:13px; }
  #st-fault .v { color:var(--bad); }
  .res-wrap { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px; margin:10px 0; }
  .res-row { display:flex; align-items:center; gap:12px; }
  .res-btn { width:52px; height:52px; font-size:28px; border-radius:50%; border:1px solid var(--line); background:#21262d; color:var(--fg); flex:none; }
  input[type=range] { flex:1; height:44px; accent-color:var(--acc); }
  #resVal { font-size:22px; font-weight:700; width:34px; text-align:center; }
  .chk { display:flex; align-items:center; gap:8px; color:var(--dim); font-size:13px; margin-top:8px; }
  .chk input { width:18px; height:18px; accent-color:var(--acc); }
  .st3 { display:flex; gap:8px; margin:4px 0 10px; }
  .st3 button { flex:1; padding:12px 0; font-size:15px; border-radius:10px; border:1px solid var(--line); background:#21262d; color:var(--fg); }
  .note { font-size:11px; color:var(--dim); margin:-4px 0 8px; line-height:1.55; }
  #log { background:#010409; border:1px solid var(--line); border-radius:12px; padding:8px 10px; height:210px; overflow-y:auto; font:11px/1.55 "SF Mono",Consolas,monospace; color:#7d8590; white-space:pre-wrap; word-break:break-all; }
  .hdr-row { display:flex; justify-content:space-between; align-items:center; }
  #connState { font-size:12px; color:var(--warn); }
  .toolbar { display:flex; gap:8px; margin:6px 0; }
  .toolbar button { flex:1; padding:10px 0; font-size:12px; border-radius:10px; border:1px solid var(--line); background:#21262d; color:var(--dim); }
</style>
</head>
<body>
<div class="hdr-row">
  <h1>莫比椭圆机控制台 <span style="font-size:11px;color:#8b949e">v1.4</span></h1><span id="connState">未连接</span>
</div>
<div class="sub">Web 版 · 三协议自适应 (v1/v2/环通) · 需 Bluefy 浏览器打开</div>

<button id="btnConn" class="btn">① 连接椭圆机</button>
<label class="chk"><input type="checkbox" id="chkAll"> 扫描不到时勾选：显示附近所有蓝牙设备</label>

<div class="grid">
  <div class="cell" id="st-proto"><div class="k">协议 / 状态</div><div class="v" id="v-proto">—</div></div>
  <div class="cell"><div class="k">机器状态</div><div class="v" id="v-state">—</div></div>
  <div class="cell"><div class="k">速度</div><div class="v" id="v-speed">—<span class="u"> km/h</span></div></div>
  <div class="cell"><div class="k">踏频</div><div class="v" id="v-rpm">—<span class="u"> rpm</span></div></div>
  <div class="cell"><div class="k">功率</div><div class="v" id="v-power">—<span class="u"> W</span></div></div>
  <div class="cell"><div class="k">心率</div><div class="v" id="v-hr">—<span class="u"> bpm</span></div></div>
  <div class="cell"><div class="k">阻力档</div><div class="v" id="v-res">—</div></div>
  <div class="cell"><div class="k">电量</div><div class="v" id="v-batt">—<span class="u"> %</span></div></div>
  <div class="cell"><div class="k">距离</div><div class="v" id="v-dist">—<span class="u"> km</span></div></div>
  <div class="cell"><div class="k">卡路里</div><div class="v" id="v-kcal">—<span class="u"> kcal</span></div></div>
  <div class="cell"><div class="k">时长</div><div class="v" id="v-time">—<span class="u"> 分:秒</span></div></div>
  <div class="cell" id="st-src"><div class="k">数据源</div><div class="v" id="v-src">—</div></div>
  <div class="cell" id="st-fault"><div class="k">故障码</div><div class="v" id="v-fault">—</div></div>
</div>

<div class="res-wrap">
  <div class="res-row">
    <button class="res-btn" id="resMinus">−</button>
    <input type="range" id="resSlider" min="1" max="24" value="1">
    <div id="resVal">1</div>
    <button class="res-btn" id="resPlus">＋</button>
  </div>
  <label class="chk"><input type="checkbox" id="chkHalve"> 踏频修正 ÷2（速度/踏频偏高时勾选）</label>
</div>

<div class="st3">
  <button data-st="1">开始</button><button data-st="2">暂停</button><button data-st="0">停止</button>
</div>
<div class="note">启停仅 v2 协议实验性可用；v1 设备踩动即出数据，无需启停。</div>

<div class="toolbar">
  <button id="btnDump">重读 GATT</button>
  <button id="btnDiag">复制诊断摘要</button>
  <button id="btnReset">重置累计</button>
</div>
<div class="toolbar">
  <button id="btnCopy">复制日志</button>
  <button id="btnClear">清空日志</button>
</div>
<div id="log"></div>

<script id="proto">
/* ================= 协议层（纯函数，node 可测） ================= */
var POWER_C = [39.94501450202982, -67.52588516, -39.15593086,
               27.55487038, 38.79652081, -0.30231185];
var UNLOCK_FRAME = new Uint8Array([0x11, 0x82, 0x07]);
var SPEED_DIV_RPM = 10.72;   /* 莫比 App: speed = rpm/2.68, 椭圆机再 /4 */

function calcPower(rpm, resistance, resMax) {
  if (!resMax || resMax <= 0) resMax = 24;
  var e1 = Math.exp(rpm / 100.0);
  var e2 = Math.exp(((resistance * 32.0 / resMax) / 10.0));
  var c = POWER_C;
  var p = c[5]*e2*e2 + c[4]*e1*e2 + c[3]*e1*e1 + c[2]*e2 + c[1]*e1 + c[0];
  return Math.max(0, p);
}
function derivedSpeed(rpm) { return (rpm || 0) / SPEED_DIV_RPM; }
function derivedPower(rpm, res, resMax, subtype) {
  var p = calcPower(rpm || 0, res || 1, resMax || 24);
  if (subtype === 0x11) p *= 1.5;          /* DeviceToolsKt.elliptical0B11 */
  return p;
}
function buildV01ResFrame(lastAb, res) {
  if (!lastAb || lastAb.length <= 6) throw new Error("尚未收到设备AB帧,无法构造阻力指令");
  return new Uint8Array([0xAB, 0x03, 0x00, lastAb[3], lastAb[4], res & 0xFF, lastAb[6]]);
}
function buildV02ResFrame(res) {
  return new Uint8Array([0x02, String(res).length, res & 0xFF]);
}
function buildV02StateFrame(state) { return new Uint8Array([0x03 + (state % 3)]); }
function buildHtResFrame(res) {
  var b0 = 0x20, b1 = 0xC1, b2 = res & 0xFF;
  return new Uint8Array([b0, b1, b2, 0x00, (b0 + b1 + b2) % 256]);
}
function parseV01(d, st, ev) {
  if (!d || !d.length) return;
  if (d[0] === 0xAB && d.length > 6) st.lastAb = d;
  if (d[0] === 0xAB && d.length >= 11) {
    st.frameType = "AB";
    var major = d[1];
    if (d[2] >= 0 && d[2] <= 3) st.battery = d[5];
    if (major === 4 && d.length > 4) {
      st.machineFamily = ({9:"划船机",10:"单车",11:"椭圆机",12:"跑步机"})[d[3]] || String(d[3]);
      st.isElliptical = (d[3] === 11);
      st.subtypeDetail = d[4];
      st.resMax = (d[4] === 0x12) ? 8 : 24;
    }
    if (d.length > 13 && major === 4 && (d[3] === 10 || d[3] === 11)) st.resistance = d[13];
    if (d.length > 14 && d[14] >= 30 && d[14] <= 220) st.hr = d[14];
    var period = ((d[7]<<24)|(d[8]<<16)|(d[9]<<8)|d[10]) >>> 0;
    st.periodMs = period;
    if (period > 0) {
      var rpm = 60000.0 / period;
      if (st.isElliptical && st.halveRpm !== false) rpm /= 2.0;
      st.rpm = rpm; ev.push("tick");
    }
    if (d.length > 17 && d[17] !== 0) { st.fault = d[17]; ev.push("fault"); }
  } else if (d[0] === 0xAC) {
    if (d.length > 4 && d[1] === 1 && d[2] === 3) { st.lastCmd = d[4]; ev.push("cmd"); }
  } else if (d[0] === 0xAD) {
    if (d.length >= 3) st.tmallPeriod = (d[1]<<8)|d[2];
  } else if (d[0] === 0xAE) {
    if (d.length > 3 && d[1] === 1) st.foldState = d[3];
  }
}
/* v0x02 8813 全量帧（与 App BluetoothLeService$didConnectBleVer0x02Device$15 逐字节对齐）
   [0]=速度/10 [1]=坡度 [2]=踏频 [3..4]=BE时长s [5..6]=BE距离m [7..8]=BE卡路里/10 [9..10]=BE功率W(len==11) */
function parseV02_8813(d, st) {
  if (!d || d.length <= 8) return false;
  st.devSpeed   = d[0] / 10.0;
  st.devIncline = d[1];
  st.devCadence = d[2];
  st.devDurS    = (d[3]<<8)|d[4];
  st.devDistM   = (d[5]<<8)|d[6];
  st.devKcal    = ((d[7]<<8)|d[8]) / 10.0;
  if (d.length === 11) st.devPower = (d[9]<<8)|d[10];
  st.devT = Date.now();
  st.src8813 = true;
  return true;
}
function parseV02_8811(d, st, magnets) {
  if (!d || d.length < 2) return;
  var period = (d[0]<<8)|d[1];
  st.periodMs = period;
  if (period === 0) return;
  var m = (magnets && magnets > 0) ? magnets : 1;
  var rpm = (60000.0 / period) / m;
  if (rpm >= 1 && rpm <= 300) st.rpm = rpm;
}
function parseHtFff1(d, st) {
  if (d.length === 12 && d[1] !== 0) {
    var s = d[2].toString(16).toUpperCase() + d[3].toString(16).toUpperCase().padStart(2, "0");
    var rpm = parseFloat(s);
    if (!isNaN(rpm)) st.rpm = rpm;
  }
}
function parseHr(d) {
  if (!d || !d.length) return null;
  var hex = "";
  for (var i = 0; i < d.length; i++) hex += d[i].toString(16).toUpperCase().padStart(2, "0");
  var v = parseInt(hex, 16);
  if (isNaN(v)) return null;
  if (v > 300) v %= 300;
  return (v >= 30 && v <= 300) ? v : null;
}
function fmtTime(s) {
  s = Math.max(0, Math.floor(s || 0));
  var m = Math.floor(s / 60), sec = s % 60, h = Math.floor(m / 60); m = m % 60;
  function p(n) { return (n < 10 ? "0" : "") + n; }
  return h > 0 ? (h + ":" + p(m) + ":" + p(sec)) : (m + ":" + p(sec));
}
/* ====== UUID 规范化（iOS/Bluefy 可能返回短格式 UUID） ====== */
function normUuid(u) {
  u = (u || "").toLowerCase();
  if (u.length === 4) return "0000" + u + "-0000-1000-8000-00805f9b34fb";
  if (u.length === 8) return u + "-0000-1000-8000-00805f9b34fb";
  return u;
}
function s4(u) {
  var head = normUuid(u).split("-")[0];                 /* 0000ffe0 / 02030000 */
  return head.indexOf("0000") === 0 ? head.slice(4) : head;   /* ffe0 / 02030000 */
}

/* ================ 自检（node 与 ?selftest 共用） ================ */
function runSelfTests(log) {
  var pass = 0, fail = 0;
  function ck(name, cond, detail) {
    if (cond) { pass++; log("  [PASS] " + name + (detail ? " " + detail : "")); }
    else { fail++; log("  [FAIL] " + name + (detail ? " " + detail : "")); }
  }
  var fr = new Uint8Array(18);
  fr[0]=0xAB; fr[1]=4; fr[2]=1; fr[3]=11; fr[4]=0x11; fr[5]=0x55;
  fr[7]=0; fr[8]=1; fr[9]=0x86; fr[10]=0xA0;
  fr[13]=7; fr[14]=120; fr[6]=0x55;
  var st = {halveRpm:true}, ev = [];
  parseV01(fr, st, ev);
  ck("AB帧: 机型=椭圆机", st.isElliptical === true);
  ck("AB帧: 电量=85", st.battery === 85, String(st.battery));
  ck("AB帧: 阻力=7", st.resistance === 7);
  ck("AB帧: 心率=120", st.hr === 120);
  ck("AB帧: rpm=0.3", Math.abs((st.rpm||0) - 0.3) < 0.01, String(st.rpm));
  ck("AB帧: 上限=24", st.resMax === 24);
  var f1 = buildV01ResFrame(fr, 5);
  ck("v1阻力帧", Array.from(f1).join(",") === "171,3,0,11,17,5,85", Array.from(f1).join(" "));
  ck("v2阻力帧6", Array.from(buildV02ResFrame(6)).join(",") === "2,1,6");
  ck("v2阻力帧24", Array.from(buildV02ResFrame(24)).join(",") === "2,2,24");
  ck("v2解锁帧", Array.from(UNLOCK_FRAME).join(",") === "17,130,7");
  var fh = buildHtResFrame(9);
  ck("环通帧9", Array.from(fh).join(",") === "32,193,9,0,234");
  var st2 = {};
  var ok13 = parseV02_8813(new Uint8Array([64,0,80, 2,88, 7,208, 0,153, 0,155]), st2);
  ck("8813接受(len=11)", ok13 === true);
  ck("8813速度6.4", st2.devSpeed === 6.4, String(st2.devSpeed));
  ck("8813踏频80", st2.devCadence === 80);
  ck("8813时长600", st2.devDurS === 600);
  ck("8813距离2000", st2.devDistM === 2000);
  ck("8813热量15.3", st2.devKcal === 15.3);
  ck("8813功率155", st2.devPower === 155);
  ck("8813置位 src8813", st2.src8813 === true);
  var st2b = {};
  ck("8813拒绝(len=8)", parseV02_8813(new Uint8Array([1,2,3,4,5,6,7,8]), st2b) === false);
  var st2c = {};
  parseV02_8813(new Uint8Array([1,2,3,4,5,6,7,8,9]), st2c);
  ck("8813 len=9 无功率字段", st2c.devPower === undefined && st2c.devDurS === ((4<<8)|5));
  var st3 = {};
  parseV02_8811(new Uint8Array([0x03,0xE8]), st3, 1);
  ck("8811→60rpm", Math.abs((st3.rpm||0)-60) < 0.01, String(st3.rpm));
  var st3b = {};
  parseV02_8811(new Uint8Array([0x03,0xE8]), st3b, 2);
  ck("8811磁钢2→30rpm", Math.abs((st3b.rpm||0)-30) < 0.01, String(st3b.rpm));
  var st4 = {};
  parseHtFff1(new Uint8Array([0,1,0x00,0x30,0,0,0,0,0,0,0,0]), st4);
  ck("环通BCD→30rpm", st4.rpm === 30, String(st4.rpm));
  ck("心率0048→72", parseHr(new Uint8Array([0x00,0x48])) === 72);
  var p = calcPower(60, 12, 24);
  ck("功率公式", p > 0 && p < 500, p.toFixed(1) + "W");
  ck("推算速度 60rpm=5.6km/h", Math.abs(derivedSpeed(60) - 5.6) < 0.01, String(derivedSpeed(60)));
  ck("推算功率>0", derivedPower(60, 12, 24) > 0);
  ck("时长 0s", fmtTime(0) === "0:00", fmtTime(0));
  ck("时长 65s", fmtTime(65) === "1:05", fmtTime(65));
  ck("时长 3725s", fmtTime(3725) === "1:02:05", fmtTime(3725));
  ck("UUID短→完整", normUuid("ffe0") === "0000ffe0-0000-1000-8000-00805f9b34fb", normUuid("ffe0"));
  ck("UUID s4(完整)", s4("0000FFE0-0000-1000-8000-00805F9B34FB") === "ffe0");
  ck("UUID s4(短)", s4("ffe0") === "ffe0");
  ck("UUID s4(8位)", s4("02030000") === "02030000", s4("02030000"));
  log("== 结果: " + (fail === 0 ? "全部通过 (" + pass + ")" : "失败 " + fail + " 项") + " ==");
  return fail === 0;
}
if (typeof module !== "undefined" && module.exports) {
  module.exports = { calcPower, derivedSpeed, derivedPower, buildV01ResFrame, buildV02ResFrame,
    buildV02StateFrame, buildHtResFrame, parseV01, parseV02_8813, parseV02_8811, parseHtFff1,
    parseHr, fmtTime, normUuid, s4, runSelfTests, UNLOCK_FRAME, SPEED_DIV_RPM };
}
</script>

<script>
/* ================= Web 应用层 ================= */
(function () {
"use strict";
var $ = function (id) { return document.getElementById(id); };
var logBox = $("log");
function log(t) {
  var time = new Date().toTimeString().slice(0, 8);
  logBox.textContent += "[" + time + "] " + t + "\n";
  var lines = logBox.textContent.split("\n");
  if (lines.length > 500) logBox.textContent = lines.slice(-500).join("\n");
  logBox.scrollTop = logBox.scrollHeight;
}
function hexs(u8) { return Array.from(u8).map(function (b) { return b.toString(16).toUpperCase().padStart(2, "0"); }).join(" "); }
function setV(id, v) { if (v !== undefined && v !== null && v !== "") $(id).textContent = v; }
function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }

var S = {
  device: null, server: null, protocol: "",
  st: { halveRpm: false },
  svcList: [], svcMap: {},
  magnets: 1, resMax: 24, interval: null,
  htTimer: null, htResistance: 1, connected: false,
  writeCharV01: null, integTimer: null, subCount: 0,
  stats: {},       /* tag -> {n, last} */
  thr: {}          /* 日志节流 */
};

var OPTIONAL = [
  "00008800-0000-1000-8000-00805f9b34fb", "00008900-0000-1000-8000-00805f9b34fb",
  "00008a00-0000-1000-8000-00805f9b34fb", "0000ffe0-0000-1000-8000-00805f9b34fb",
  "0000ffc0-0000-1000-8000-00805f9b34fb", "0000fff0-0000-1000-8000-00805f9b34fb",
  "0000180d-0000-1000-8000-00805f9b34fb", "0000180f-0000-1000-8000-00805f9b34fb",
  "0000180a-0000-1000-8000-00805f9b34fb", "00001826-0000-1000-8000-00805f9b34fb",
  "00001800-0000-1000-8000-00805f9b34fb", "00001801-0000-1000-8000-00805f9b34fb",
  "00001812-0000-1000-8000-00805f9b34fb", "00001816-0000-1000-8000-00805f9b34fb",
  "0000181c-0000-1000-8000-00805f9b34fb", "00001822-0000-1000-8000-00805f9b34fb"
];

function note(tag, u8) {
  var s = S.stats[tag] || (S.stats[tag] = { n: 0, last: "" });
  s.n++; s.last = hexs(u8);
}
function logThr(key, ms, text) {
  var now = Date.now();
  if (S.thr[key] && now - S.thr[key] < ms) return;
  S.thr[key] = now; log(text);
}

/* ---------- 连接 ---------- */
async function connect() {
  if (!navigator.bluetooth) { log("错误: 当前浏览器不支持 Web Bluetooth, 请用 Bluefy 打开"); return; }
  $("btnConn").disabled = true; $("btnConn").textContent = "选择设备中…";
  try {
    var opts;
    if ($("chkAll").checked) {
      opts = { acceptAllDevices: true, optionalServices: OPTIONAL };
    } else {
      opts = { filters: [
        { services: ["00008800-0000-1000-8000-00805f9b34fb"] },
        { services: ["0000ffe0-0000-1000-8000-00805f9b34fb"] },
        { services: ["0000ffc0-0000-1000-8000-00805f9b34fb"] },
        { services: ["0000fff0-0000-1000-8000-00805f9b34fb"] },
        { services: ["0000180d-0000-1000-8000-00805f9b34fb"] },
        { services: ["00001826-0000-1000-8000-00805f9b34fb"] },
        { namePrefix: "MOBI" }, { namePrefix: "MB-" }
      ], optionalServices: OPTIONAL };
    }
    var device = await navigator.bluetooth.requestDevice(opts);
    S.device = device;
    device.addEventListener("gattserverdisconnected", onDisconnected);
    $("btnConn").textContent = "连接中…";
    log("已选择: " + (device.name || "(无名)"));
    S.server = await device.gatt.connect();
    S.connected = true;
    setConnState("已连接");
    log("GATT 已连接, 扫描服务…");

    S.svcList = await S.server.getPrimaryServices();
    S.svcMap = {};
    var names = [];
    for (var i = 0; i < S.svcList.length; i++) {
      var sv = S.svcList[i], id = s4(sv.uuid);
      S.svcMap[id] = sv;
      names.push(id || sv.uuid);
    }
    log("发现服务(" + S.svcList.length + "): " + names.join(" "));

    await dumpGatt();

    var has8800 = !!S.svcMap["8800"], hasHR = !!S.svcMap["180d"],
        hasFff0 = !!S.svcMap["fff0"], hasFfe0 = !!S.svcMap["ffe0"],
        hasFfc0 = !!S.svcMap["ffc0"];
    var name = (device.name || "").toUpperCase();
    var proto;
    if (has8800) proto = "v0x02";
    else if (hasHR && !hasFff0 && !hasFfe0 && !hasFfc0) proto = "心率带";
    else if (hasFff0 && !hasHR && name.indexOf("MOBI-") === 0 && name.indexOf("MOBI-C") !== 0) proto = "环通";
    else proto = "v0x01";
    S.protocol = proto;
    setV("v-proto", proto);
    log("判定协议: " + proto + "  [8800=" + has8800 + " ffe0=" + hasFfe0 + " ffc0=" + hasFfc0 + " fff0=" + hasFff0 + " 180d=" + hasHR + "]");

    S.st._lastT = null;
    if (proto === "v0x02") await setupV02();
    else if (proto === "环通") await setupHt();
    else if (proto === "心率带") await setupHrOnly();
    else await setupV01();
    startIntegrator();
    render();
    $("btnConn").textContent = "已连接 · 点击断开";
  } catch (e) {
    log("连接流程异常: " + (e && e.message ? e.message : e));
    S.connected = false; setConnState("未连接");
    $("btnConn").textContent = "① 连接椭圆机";
  }
  $("btnConn").disabled = false;
}
async function disconnect() {
  stopIntegrator();
  if (S.htTimer) { clearInterval(S.htTimer); S.htTimer = null; }
  try { if (S.server && S.server.connected) await S.server.disconnect(); } catch (e) {}
}
function onDisconnected() {
  S.connected = false; setConnState("已断开"); stopIntegrator();
  setV("v-proto", "—"); log("设备已断开");
  $("btnConn").textContent = "① 连接椭圆机";
  if (S.htTimer) { clearInterval(S.htTimer); S.htTimer = null; }
}
function setConnState(t) { $("connState").textContent = t; $("connState").style.color = t === "已连接" ? "var(--acc)" : "var(--warn)"; }

/* ---------- GATT 结构诊断 ---------- */
async function dumpGatt() {
  log("==== GATT 结构 ====");
  for (var i = 0; i < S.svcList.length; i++) {
    var sv = S.svcList[i];
    log("  SVC " + sv.uuid);
    var chars = [];
    try { chars = await sv.getCharacteristics(); } catch (e) { log("     (读取特征失败: " + e.message + ")"); continue; }
    for (var j = 0; j < chars.length; j++) {
      var c = chars[j], p = c.properties || {}, f = [];
      if (p.read) f.push("R");
      if (p.write) f.push("W");
      if (p.writeWithoutResponse) f.push("Wnr");
      if (p.notify) f.push("N");
      if (p.indicate) f.push("I");
      log("     CH " + c.uuid + "  [" + (f.join(",") || "-") + "]");
    }
  }
  log("====================");
}

/* ---------- 服务/特征查找（短 UUID，兼容 iOS） ---------- */
async function findChar(shortSvc, shortChar) {
  var sv = S.svcMap[shortSvc];
  if (!sv) return null;
  try {
    var chars = await sv.getCharacteristics();
    for (var i = 0; i < chars.length; i++) if (s4(chars[i].uuid) === shortChar) return chars[i];
  } catch (e) {}
  return null;
}
async function findCharAnywhere(shortChar) {
  for (var i = 0; i < S.svcList.length; i++) {
    var chars = [];
    try { chars = await S.svcList[i].getCharacteristics(); } catch (e) { continue; }
    for (var j = 0; j < chars.length; j++) if (s4(chars[j].uuid) === shortChar) return chars[j];
  }
  return null;
}
async function cRead(shortSvc, shortChar) {
  var c = await findChar(shortSvc, shortChar);
  if (!c) { log("未找到特征 " + shortSvc + "|" + shortChar); return null; }
  try {
    var dv = await c.readValue();
    var u8 = new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength);
    log("R " + shortChar + " -> " + (u8.length ? hexs(u8) : "(空)"));
    return u8;
  } catch (e) { log("R " + shortChar + " 失败: " + (e.message || e)); return null; }
}
async function cWriteChar(c, u8, label) {
  try {
    await c.writeValueWithResponse(u8);
    log("W " + (label || s4(c.uuid)) + " <- " + hexs(u8));
    return true;
  } catch (e1) {
    try {
      await c.writeValueWithoutResponse(u8);
      log("W(无响应) " + (label || s4(c.uuid)) + " <- " + hexs(u8));
      return true;
    } catch (e2) {
      log("W 失败 " + (label || "") + ": " + (e2.message || e2));
      return false;
    }
  }
}
async function cWrite(shortSvc, shortChar, u8) {
  var c = await findChar(shortSvc, shortChar);
  if (!c) throw new Error("无特征 " + shortSvc + "|" + shortChar);
  if (!await cWriteChar(c, u8, shortChar)) throw new Error("写入被拒绝 " + shortChar);
}
async function tryNotify(c, handler, label) {
  try {
    await c.startNotifications();
    c.addEventListener("characteristicvaluechanged", function (ev) {
      var dv = ev.target.value;
      handler(new Uint8Array(dv.buffer, dv.byteOffset, dv.byteLength), label);
    });
    log("订阅 " + label);
    return true;
  } catch (e) {
    log("订阅 " + label + " 失败: " + (e.message || e));
    return false;
  }
}

/* ---------- v0x02 ---------- */
async function setupV02() {
  var d = await cRead("8800", "8801");
  if (d && d.length) {
    S.interval = d[0];
    log("interval=" + d[0] + (d[0] === 1
      ? " → 设备只上报 8811/8812(踏频/阻力), 不发 8813 全量帧 → 速度/功率/距离/热量/时长由本页按莫比算法推算"
      : " → 全量模式 (8813 应可用)"));
  } else log("警告: 8801 上报模式读取失败, 无法判断设备是否发送全量帧 8813");
  d = await cRead("8800", "8805"); if (d && d.length && d[0]) { S.magnets = d[0]; log("磁钢数=" + d[0]); }
  d = await cRead("8800", "8802"); if (d && d.length) log("8802 机型码=" + hexs(d));
  d = await cRead("8800", "8806");
  if (d && d.length > 2 && d[2] > 0) { S.resMax = d[2]; $("resSlider").max = d[2]; log("阻力上限=" + d[2]); }
  d = await cRead("180f", "2a19"); if (d && d.length) setV("v-batt", d[0]);
  var uc = await findChar("8800", "88ff");
  if (uc) { if (await cWriteChar(uc, UNLOCK_FRAME, "88ff")) S.st.unlocked = true; }
  else log("未找到 88ff 解锁特征");

  var subs = ["880e", "8811", "8812", "8813"], n = 0, skip = [];
  for (var i = 0; i < subs.length; i++) {
    var c = await findChar("8800", subs[i]);
    if (!c) { log("未找到特征 8800|" + subs[i]); continue; }
    if (await tryNotify(c, onV02Data, subs[i])) n++; else skip.push(subs[i]);
  }
  S.subCount = n;
  /* 兜底: 8800 服务下其余可通知特征全部订阅（可发现厂商私有帧） */
  var extra = [];
  var sv8800 = S.svcMap["8800"];
  if (sv8800) {
    var cs = [];
    try { cs = await sv8800.getCharacteristics(); } catch (e) {}
    for (var j = 0; j < cs.length; j++) {
      var id = s4(cs[j].uuid), p = cs[j].properties || {};
      if (subs.indexOf(id) >= 0) continue;
      if (!(p.notify || p.indicate)) continue;
      if (await tryNotify(cs[j], onV02Data, "8800:" + id)) extra.push(id);
    }
  }
  /* 心率: 莫比 BLE 侧只有 180d/2a37 一条通道 (源码 BluetoothLeService:565-590,
     服务180d→2a37→postHeartData(false)→HeartRateMachineInterceptor = 机器/握把心率) */
  var hrSvc = !!S.svcMap["180d"];
  var hc = await findChar("180d", "2a37");
  if (hc) {
    try { await cRead("180d", "2a37"); } catch (e) {}
    await tryNotify(hc, onHr, "2a37");
    log("已订阅 180d/2a37 → 握把心率走此通道, 握住握片应出现数值");
  } else {
    log("180d 心率服务" + (hrSvc ? "存在但无 2a37 特征" : "不存在") +
        " → 蓝牙侧无心率输出 (握把心率若仅显示在机器自带仪表上则读不到)");
  }
  log("v0x02 装配完成, 标准订阅 " + n + "/4" + (skip.length ? " (失败: " + skip.join(",") + ")" : "") +
      (extra.length ? " · 额外订阅 " + extra.join(",") : ""));
}
function onV02Data(u8, tag) {
  note(tag, u8);
  var st = S.st;
  if (tag === "880e") {
    logThr("880e", 5000, "N 880e <- " + hexs(u8));
    if (u8.length) setV("v-state", ({0:"停止",1:"运行",2:"暂停"})[u8[0]] || u8[0]);
  } else if (tag === "8811") {
    logThr("8811", 3000, "N 8811 <- " + hexs(u8));
    parseV02_8811(u8, st, S.magnets);
    render();
  } else if (tag === "8812") {
    logThr("8812", 3000, "N 8812 <- " + hexs(u8));
    if (u8.length && u8[0] >= 1 && u8[0] <= S.resMax) { st.resistance = u8[0]; setV("v-res", u8[0]); syncSlider(u8[0]); }
  } else if (tag === "8813") {
    log("N 8813 <- " + hexs(u8) + " (len=" + u8.length + ")");
    if (parseV02_8813(u8, st)) log("  → 全量帧已解析: 速度/时长/距离/热量/功率 改用设备值");
    else log("  → 8813 长度 " + u8.length + " ≤8, 按协议忽略");
    render();
  } else {
    logThr(tag, 3000, "N " + tag + " <- " + hexs(u8));
  }
}
function onHr(u8, tag) {
  note(tag || "2a37", u8);
  var hr = parseHr(u8);
  if (hr) { S.st.hr = hr; setV("v-hr", hr); }
}

/* ---------- v0x01 ---------- */
/* 阻力写特征选择: ffe3 > ffe2 > ffed > 运动服务(ffe0/ffc0/fff0)下的可写 > 任意可写 */
async function pickV01WriteChar() {
  var CAND = ["ffe3", "ffe2", "ffed"];
  for (var k = 0; k < CAND.length; k++) {
    var c = await findCharAnywhere(CAND[k]);
    if (c) return c;
  }
  var order = ["ffe0", "ffc0", "fff0"];
  var svcs = S.svcList.slice().sort(function (a, b) {
    var pa = order.indexOf(s4(a.uuid)), pb = order.indexOf(s4(b.uuid));
    return (pa < 0 ? 99 : pa) - (pb < 0 ? 99 : pb);
  });
  for (var i = 0; i < svcs.length; i++) {
    var cs = [];
    try { cs = await svcs[i].getCharacteristics(); } catch (e) { continue; }
    for (var j = 0; j < cs.length; j++) {
      var p = cs[j].properties || {};
      if (p.write || p.writeWithoutResponse) return cs[j];
    }
  }
  return null;
}
async function setupV01() {
  var TARGET = ["ffe1", "ffea", "fff4", "ffeb", "ffe4"];
  var name = (S.device.name || "").toUpperCase();
  var n = 0, found = [];
  for (var i = 0; i < S.svcList.length; i++) {
    var chars = [];
    try { chars = await S.svcList[i].getCharacteristics(); } catch (e) { continue; }
    for (var j = 0; j < chars.length; j++) {
      var id = s4(chars[j].uuid);
      if (TARGET.indexOf(id) < 0) continue;
      if (id === "ffe4" && name.indexOf("MB-HW") === 0) await sleep(2000);
      if (await tryNotify(chars[j], onV01Data, s4(S.svcList[i].uuid) + ":" + id)) { n++; found.push(s4(S.svcList[i].uuid) + ":" + id); }
    }
  }
  if (n === 0) {
    log("未匹配到标准通知特征(ffe1/ffea/fff4/ffeb/ffe4), 改为订阅所有可通知特征…");
    for (var a = 0; a < S.svcList.length; a++) {
      var cs = [];
      try { cs = await S.svcList[a].getCharacteristics(); } catch (e) { continue; }
      for (var b = 0; b < cs.length; b++) {
        var p = cs[b].properties || {};
        if (!(p.notify || p.indicate)) continue;
        var lab = s4(S.svcList[a].uuid) + ":" + s4(cs[b].uuid);
        if (await tryNotify(cs[b], onV01Data, lab)) { n++; found.push(lab); }
      }
    }
  }
  S.subCount = n;
  S.writeCharV01 = await pickV01WriteChar();
  log(S.writeCharV01
    ? ("阻力写特征: " + S.writeCharV01.uuid + " [" + ((S.writeCharV01.properties.write ? "W" : "") + (S.writeCharV01.properties.writeWithoutResponse ? "Wnr" : "")) + "]")
    : "警告: 未找到任何可写特征, 无法调节阻力");
  log(n ? ("v0x01 装配完成, 已订阅: " + found.join(", ")) : "警告: 没有任何可订阅特征");
}
function onV01Data(u8, tag) {
  note(tag, u8);
  logThr(tag, 2000, "N " + tag + " <- " + hexs(u8));
  var ev = [];
  parseV01(u8, S.st, ev);
  if (S.st.resMax && S.st.resMax !== parseInt($("resSlider").max, 10)) $("resSlider").max = S.st.resMax;
  if (ev.indexOf("fault") >= 0) setV("v-fault", S.st.fault);
  render();
}

/* ---------- 环通 ---------- */
async function setupHt() {
  var rc = await findChar("fff0", "fff1");
  if (rc) await tryNotify(rc, function (u8, tag) {
    note(tag, u8);
    logThr("fff1", 3000, "N fff1 <- " + hexs(u8));
    parseHtFff1(u8, S.st);
    render();
  }, "fff1");
  else log("未找到 fff1 通知特征");
  S.htTimer = setInterval(async function () {
    if (!S.connected) return;
    var tc = await findChar("fff0", "fff2");
    if (tc) await cWriteChar(tc, buildHtResFrame(S.htResistance), "fff2");
  }, 1000);
  log("环通装配完成 (1s 周期上报阻力)");
}

/* ---------- 心率带 ---------- */
async function setupHrOnly() {
  var hc = await findChar("180d", "2a37");
  if (hc) { await tryNotify(hc, onHr, "2a37"); log("心率带装配完成"); }
  else log("未找到心率特征 2a37");
}

/* ---------- 指标推算 / 面板刷新 ---------- */
function useDevice() { return S.st.src8813 === true; }
function simSpeed() { return derivedSpeed(S.st.rpm || 0); }
function simPower() {
  return derivedPower(S.st.rpm || 0, S.st.resistance || 1, S.st.resMax || 24, S.st.subtypeDetail);
}

function render() {
  var st = S.st;
  if (st.rpm !== undefined) setV("v-rpm", st.rpm.toFixed(1));
  else if (useDevice() && st.devCadence !== undefined) setV("v-rpm", st.devCadence);

  var speed = (useDevice() && st.devSpeed !== undefined) ? st.devSpeed
            : (st.rpm !== undefined ? simSpeed() : undefined);
  if (speed !== undefined) setV("v-speed", speed.toFixed(1));

  var power = (useDevice() && st.devPower !== undefined) ? st.devPower
            : (st.rpm !== undefined ? simPower() : undefined);
  if (power !== undefined) setV("v-power", power.toFixed(1));

  if (st.resistance !== undefined) setV("v-res", st.resistance);
  if (st.hr !== undefined) setV("v-hr", st.hr);
  if (st.battery !== undefined) setV("v-batt", st.battery);

  var distM = useDevice() ? st.devDistM : st.simDistM;
  if (distM !== undefined) setV("v-dist", (distM / 1000).toFixed(2));
  var kcal = useDevice() ? st.devKcal : st.simKcal;
  if (kcal !== undefined) setV("v-kcal", kcal.toFixed(1));
  var durS = useDevice() ? st.devDurS : st.simDurS;
  if (durS !== undefined) setV("v-time", fmtTime(durS));

  if (S.protocol === "v0x02") setV("v-src", useDevice() ? "设备 8813" : "本地推算 (rpm×阻力)");
  else if (S.protocol) setV("v-src", "本地推算 (rpm×阻力)");
}

function startIntegrator() {
  if (S.integTimer) return;
  S.st._lastT = null;
  S.integTimer = setInterval(integStep, 500);
}
function stopIntegrator() {
  if (S.integTimer) { clearInterval(S.integTimer); S.integTimer = null; }
}
function integStep() {
  if (!S.connected) return;
  var st = S.st, now = Date.now();
  var last = st._lastT;
  st._lastT = now;
  if (last == null) return;
  var dt = (now - last) / 1000;
  if (dt <= 0) return;
  if (dt > 3) dt = 0;                        /* 页面被系统挂起 → 不补计 */
  if (!(st.rpm >= 1)) { render(); return; }  /* 未踩动: 时长/距离不增长 */
  if (useDevice()) { render(); return; }     /* 设备自带累计 */
  var speed = simSpeed(), power = simPower();
  st.simDistM = (st.simDistM || 0) + (speed / 3.6) * dt;
  st.simKcal  = (st.simKcal  || 0) + (power / 1000.0) * dt;
  st.simDurS  = (st.simDurS  || 0) + dt;
  render();
}
function resetTotals() {
  var st = S.st;
  st.simDistM = undefined; st.simKcal = undefined; st.simDurS = undefined;
  st.src8813 = false;
  st.devDistM = undefined; st.devKcal = undefined; st.devDurS = undefined;
  st.devSpeed = undefined; st.devPower = undefined; st.devCadence = undefined;
  setV("v-dist", "0.00"); setV("v-kcal", "0.0"); setV("v-time", "0:00");
  log("累计已重置");
  render();
}

/* ---------- 诊断摘要 ---------- */
function diagText() {
  var L = [];
  L.push("莫比椭圆机控制台 v1.3 诊断摘要  " + new Date().toLocaleString());
  L.push("设备=" + ((S.device && S.device.name) || "(未知)") + "  协议=" + (S.protocol || "-") + "  连接=" + S.connected);
  L.push("8801 interval=" + S.interval + "  8805 磁钢数=" + S.magnets + "  8806 阻力上限=" + S.resMax + "  标准订阅=" + S.subCount);
  var svcCodes = S.svcList.map(function (s) { return s4(s.uuid); });
  L.push("服务列表=" + svcCodes.join(","));
  L.push("180d 心率服务=" + (svcCodes.indexOf("180d") >= 0 ? "有" : "无") +
         "  2a37 帧数=" + ((S.stats["2a37"] && S.stats["2a37"].n) || 0));
  var keys = Object.keys(S.stats);
  if (!keys.length) L.push("(未收到任何通知帧)");
  keys.forEach(function (t) { L.push("  帧 " + t + " ×" + S.stats[t].n + "  最后一帧=" + S.stats[t].last); });
  L.push("数据源=" + (useDevice() ? "设备 8813 全量帧" : "本地推算") +
         "  rpm=" + (S.st.rpm === undefined ? "-" : S.st.rpm.toFixed(1)) +
         "  阻力=" + (S.st.resistance === undefined ? "-" : S.st.resistance) +
         "  心率=" + (S.st.hr === undefined ? "-" : S.st.hr));
  return L.join("\n");
}

/* ---------- 阻力控制 ---------- */
async function sendResistance(v) {
  if (!S.connected) { log("未连接, 无法下发阻力"); return; }
  v = Math.max(1, Math.min(Math.round(v), S.resMax || 24));
  try {
    if (S.protocol === "v0x02") {
      if (!S.st.unlocked) { await cWrite("8800", "88ff", UNLOCK_FRAME); S.st.unlocked = true; }
      await cWrite("8800", "880f", buildV02ResFrame(v));
    } else if (S.protocol === "v0x01") {
      var fr = buildV01ResFrame(S.st.lastAb, v);
      if (!S.writeCharV01) throw new Error("没有可用的写入特征");
      if (!await cWriteChar(S.writeCharV01, fr, "ffe3")) throw new Error("写入被拒绝");
    } else if (S.protocol === "环通") {
      S.htResistance = v; log("环通阻力→" + v + " (下个周期帧生效)");
    } else { log("当前协议不支持阻力控制"); return; }
    S.st.resistance = v; setV("v-res", v); render();
  } catch (e) { log("阻力下发失败: " + (e.message || e)); }
}
function syncSlider(v) { $("resSlider").value = v; $("resVal").textContent = v; }
function onSlider() {
  var v = parseInt($("resSlider").value, 10);
  $("resVal").textContent = v;
  sendResistance(v);
}
$("resSlider").addEventListener("change", onSlider);
$("resMinus").addEventListener("click", function () { var s = $("resSlider"); s.value = Math.max(1, +s.value - 1); onSlider(); });
$("resPlus").addEventListener("click", function () { var s = $("resSlider"); s.value = Math.min(+s.max, +s.value + 1); onSlider(); });
$("chkHalve").addEventListener("change", function () {
  var on = $("chkHalve").checked;
  S.st.halveRpm = on;                       /* v1: 椭圆机 rpm 再 ÷2 */
  S.magnets = on ? 2 : 1;                   /* v2: 等效于磁钢数按 2 计算 */
  log("踏频修正 ÷2: " + (on ? "开" : "关"));
});

/* ---------- 启停 (v0x02 实验) ---------- */
Array.prototype.forEach.call(document.querySelectorAll("[data-st]"), function (b) {
  b.addEventListener("click", async function () {
    if (!S.connected || S.protocol !== "v0x02") { log("启停仅 v0x02 可用"); return; }
    var st = parseInt(b.getAttribute("data-st"), 10);
    try {
      if (!S.st.unlocked) { await cWrite("8800", "88ff", UNLOCK_FRAME); S.st.unlocked = true; }
      await cWrite("8800", "880f", buildV02StateFrame(st));
    } catch (e) { log("状态帧失败: " + (e.message || e)); }
  });
});

$("btnDump").addEventListener("click", async function () {
  if (!S.connected) { log("未连接"); return; }
  await dumpGatt();
});
$("btnDiag").addEventListener("click", function () {
  var t = diagText();
  log("==== 诊断摘要 ====\n" + t + "\n=================");
  try {
    var ta = document.createElement("textarea");
    ta.value = t; document.body.appendChild(ta); ta.select();
    document.execCommand("copy"); document.body.removeChild(ta);
    log("(诊断摘要已复制到剪贴板)");
  } catch (e) { log("(复制失败, 请手动从上方日志复制)"); }
});
$("btnReset").addEventListener("click", resetTotals);
$("btnCopy").addEventListener("click", function () {
  try {
    var ta = document.createElement("textarea");
    ta.value = logBox.textContent;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand("copy");
    document.body.removeChild(ta);
    log("日志已复制到剪贴板");
  } catch (e) { log("复制失败: " + (e.message || e)); }
});
$("btnClear").addEventListener("click", function () { logBox.textContent = ""; });

/* ---------- 连接按钮 ---------- */
$("btnConn").addEventListener("click", function () {
  if (S.connected) { disconnect(); } else { connect(); }
});
